name: QR account pairing tests

on:
  push:
    branches:
      - feat/secure-qr-account-pairing
  pull_request:
    branches:
      - integration/cherry-call-management

permissions:
  contents: read

jobs:
  backend-pairing-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependency
        run: python -m pip install --upgrade pip fastapi
      - name: Run QR pairing security tests
        run: python -m unittest discover -s tests -p "test_qr_pairing.py" -v
