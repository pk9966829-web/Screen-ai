name: QR account pairing tests

on:
  push:
    branches:
      - feat/secure-qr-account-pairing
  pull_request:
    branches:
      - integration/cherry-call-management

permissions:
  contents: read

jobs:
  backend-pairing-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependency
        run: python -m pip install --upgrade pip fastapi
      - name: Run QR pairing security tests
        run: python -m unittest discover -s tests -p "test_qr_pairing.py" -v

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble Android debug app
        run: gradle -p android --no-daemon :app:assembleDebug

  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "screen ai/package-lock.json"
      - name: Install web dependencies
        working-directory: screen ai
        run: npm ci
      - name: Build web application
        working-directory: screen ai
        run: npm run build
