name: VOSI Android integration checks

on:
  push:
    branches:
      - fix/vosi-android-integration-stability
  pull_request:
    branches:
      - main
      - feature/vosi-android-timers

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build VOSI Android debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

  identity-backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx
      - name: Test VOSI identity and device linking
        working-directory: backend
        run: python -m pytest ../tests/test_identity_api.py ../tests/test_device_registry.py -q
