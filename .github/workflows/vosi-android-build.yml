name: VOSI Android build

on:
  push:
    branches:
      - feature/vosi-native-mobile-dashboard
    paths:
      - "android/**"
      - ".github/workflows/vosi-android-build.yml"
  pull_request:
    branches:
      - feature/vosi-incoming-call-screening
    paths:
      - "android/**"
      - ".github/workflows/vosi-android-build.yml"
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found on this runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build VOSI Companion debug APK
        run: gradle -p android :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vosi-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
