name: VOSI Android build

on:
  push:
    branches:
      - feature/vosi-native-mobile-dashboard
    paths:
      - "android/**"
      - ".github/workflows/vosi-android-build.yml"
  pull_request:
    branches:
      - feature/vosi-incoming-call-screening
    paths:
      - "android/**"
      - ".github/workflows/vosi-android-build.yml"
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build VOSI Companion debug APK
        run: gradle -p android :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vosi-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
