name: VOSI autonomous agent foundation

on:
  push:
    branches:
      - feature/vosi-autonomous-companion-foundation
  pull_request:
    branches:
      - main
      - feature/whatsapp-personal-android
  workflow_dispatch:

jobs:
  backend-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx
      - name: Validate Chrome extension JavaScript and manifest
        run: |
          node --check "screen ai/chrome-extension/service-worker.js"
          node --check "screen ai/chrome-extension/content.js"
          node --check "screen ai/chrome-extension/popup.js"
          python -c "import json; json.load(open('screen ai/chrome-extension/manifest.json', encoding='utf-8'))"
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          html = Path("screen ai/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.IGNORECASE)
          for index, script in enumerate(scripts):
              if not script.strip():
                  continue
              path = Path(tempfile.gettempdir()) / f"vosi-inline-{index}.js"
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Validated {len(scripts)} inline script blocks.")
          PY
      - name: Test VOSI agent runtime
        working-directory: backend
        run: python -m pytest ../tests/test_agent_runtime.py ../tests/test_agent_api.py ../tests/test_device_registry.py ../tests/test_browser_bridge_auth.py ../tests/test_companion.py -q

  windows-desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Windows Tauri desktop build
        run: cargo check --manifest-path "screen ai/src-tauri/Cargo.toml"
