name: VOSI Companion checks

on:
  push:
    branches:
      - feature/whatsapp-personal-android
  pull_request:
    branches:
      - feature/whatsapp-personal-android
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx
      - name: Test authenticated WhatsApp companion API
        working-directory: backend
        run: python -m pytest ../tests/test_companion.py -q

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build VOSI Companion debug APK
        run: gradle -p android :app:assembleDebug
