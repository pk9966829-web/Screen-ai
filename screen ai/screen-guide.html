<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOSI Click Guide</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
  body { font-family: Inter, system-ui, sans-serif; pointer-events: none; user-select: none; }
  #target { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #target.visible { display: block; }
  .ring {
    width: 62px; height: 62px; border-radius: 50%;
    border: 3px solid #38bdf8;
    box-shadow: 0 0 0 5px rgba(56,189,248,.17), 0 0 28px rgba(56,189,248,.85), inset 0 0 16px rgba(56,189,248,.2);
    animation: pulse 1.15s ease-in-out infinite;
  }
  .center { position: absolute; width: 10px; height: 10px; left: 50%; top: 50%; transform: translate(-50%,-50%); border-radius: 50%; background: #e0f2fe; box-shadow: 0 0 14px #38bdf8; }
  .label {
    position: absolute; left: 50%; top: 72px; transform: translateX(-50%);
    min-width: 180px; max-width: 300px; padding: 10px 13px;
    border: 1px solid rgba(56,189,248,.75); border-radius: 12px;
    background: rgba(5,12,28,.96); color: #e0f2fe;
    box-shadow: 0 8px 30px rgba(0,0,0,.42), 0 0 18px rgba(56,189,248,.2);
    text-align: center; white-space: normal;
  }
  #instruction { font-size: 13px; font-weight: 700; line-height: 1.35; }
  #target-label { margin-top: 4px; color: #7dd3fc; font-size: 10px; }
  .tail { position: absolute; left: 50%; top: 62px; transform: translateX(-50%); width: 2px; height: 10px; background: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .76; } }
</style>
</head>
<body>
  <div id="target" aria-hidden="true">
    <div class="ring"></div><div class="center"></div><div class="tail"></div>
    <div class="label"><div id="instruction">Click the highlighted control</div><div id="target-label">Next step</div></div>
  </div>
  <script type="module">
    const { listen } = window.__TAURI__.event;
    const guideWindow = window.__TAURI__.window.getCurrentWindow();
    const target = document.getElementById('target');
    const instruction = document.getElementById('instruction');
    const targetLabel = document.getElementById('target-label');
    let hideTimer = null;

    listen('vosi-guidance', (event) => {
      const guide = event.payload || {};
      const x = Number(guide.target_x);
      const y = Number(guide.target_y);
      if (!Number.isFinite(x) || !Number.isFinite(y) || x < 0 || x > 1000 || y < 0 || y > 1000) return;
      target.style.left = (x / 10) + '%';
      target.style.top = (y / 10) + '%';
      instruction.textContent = String(guide.instruction || 'Click the highlighted control').slice(0, 180);
      targetLabel.textContent = String(guide.target_label || 'Next step').slice(0, 100);
      target.classList.add('visible');
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => { target.classList.remove('visible'); guideWindow.hide().catch(() => {}); }, 9000);
    });

    listen('vosi-guidance-clear', () => {
      target.classList.remove('visible');
      if (hideTimer) clearTimeout(hideTimer);
      guideWindow.hide().catch(() => {});
    });
  </script>
</body>
</html>
