<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOSI Companion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; border: none !important; outline: none !important; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: rgba(0,0,0,0) !important;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 8px;
    }

    #companion {
      position: relative;
      width: 64px; height: 64px;
      cursor: grab;
      display: flex;
      touch-action: none;
      align-items: center;
      justify-content: center;
    }
    #companion:active { cursor: grabbing; }

    .glow {
      position: absolute; inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56,189,248,0.28) 0%, transparent 70%);
      opacity: 0.55;
      pointer-events: none;
      transition: opacity 0.35s, transform 0.35s;
    }

    .logo-mark {
      width: 52px; height: 52px;
      display: block;
      object-fit: contain;
      border-radius: 50%;
      background: transparent;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0 9px rgba(56,189,248,0.42));
      transition: transform 0.3s, filter 0.3s;
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }


    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    #companion.idle .logo-mark { animation: float 3.5s ease-in-out infinite; }

    #companion.asking .logo-mark { animation: ask-bounce 0.7s ease-in-out infinite; }
    #companion.asking .glow {
      opacity: 1;
      background: radial-gradient(circle, rgba(251,191,36,0.45) 0%, transparent 70%);
    }
    @keyframes ask-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-7px) scale(1.05); }
      60% { transform: translateY(-3px) scale(1.02); }
    }

    #companion.observing .glow {
      opacity: 1;
      background: radial-gradient(circle, rgba(56,189,248,0.5) 0%, transparent 70%);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    #companion.thinking .logo-mark { animation: think 1.2s ease-in-out infinite; }
    @keyframes think {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    #companion.working .logo-mark { animation: work 0.8s ease-in-out infinite; }
    #companion.working .glow {
      opacity: 0.9;
      background: radial-gradient(circle, rgba(167,139,250,0.45) 0%, transparent 70%);
    }
    @keyframes work {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    #companion.attention .logo-mark { animation: bounce 0.55s ease-in-out infinite; }
    #companion.attention .glow {
      opacity: 1;
      background: radial-gradient(circle, rgba(251,191,36,0.55) 0%, transparent 70%);
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-4px); }
    }

    #speech {
      position: absolute;
      left: 72px;
      top: 50%;
      transform: translateY(-50%) scale(0.9);
      background: rgba(7, 12, 28, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(56,189,248,0.35) !important;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 500;
      color: #e0f2fe;
      white-space: nowrap;
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 20;
      -webkit-app-region: no-drag;
    }
    #speech::before {
      content: '';
      position: absolute;
      left: -6px; top: 50%;
      transform: translateY(-50%);
      border: 6px solid transparent;
      border-right-color: rgba(7, 12, 28, 0.95);
    }
    #speech.visible {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    #bubble {
      position: absolute;
      left: 74px;
      top: 50%;
      transform: translateY(-50%);
      width: 270px;
      background: rgba(7, 12, 28, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56,189,248,0.25) !important;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 10;
      -webkit-app-region: no-drag;
    }
    #bubble.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-50%) translateX(4px);
    }
    #bubble h4 {
      font-size: 12px; font-weight: 600;
      color: #e0f2fe; margin-bottom: 8px;
    }
    #bubble .status {
      font-size: 10px; color: #94a3b8;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    #bubble .status .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #64748b;
    }
    #bubble .status.observing .dot {
      background: #38bdf8; box-shadow: 0 0 6px #38bdf8;
    }
    #bubble button {
      display: block; width: 100%;
      padding: 7px 10px; margin-bottom: 6px;
      border: none !important; border-radius: 8px;
      font-size: 11px; font-weight: 500;
      cursor: pointer; transition: background 0.15s;
      text-align: left;
      -webkit-app-region: no-drag;
    }
    #bubble button.primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
    }
    #bubble button.primary:hover { filter: brightness(1.1); }
    #bubble button.secondary {
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
    }
    #bubble button.secondary:hover { background: rgba(255,255,255,0.12); }
    #bubble button:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <div id="companion" class="idle">
    <div class="glow"></div>
    <img class="logo-mark" src="./src/assets/logo.svg" alt="VOSI logo" draggable="false" />
  </div>

  <div id="speech">
    <span id="speech-text">Can I watch your screen?</span>
  </div>

  <div id="bubble">
    <h4>What can I help with?</h4>
    <div class="status" id="bubble-status">
      <span class="dot"></span>
      <span id="status-text">Idle</span>
    </div>
    <div id="answer" style="display:none;max-height:150px;overflow:auto;margin:8px 0;padding:9px;border-radius:9px;background:rgba(255,255,255,0.05);color:#dbeafe;font-size:10px;line-height:1.5;white-space:pre-wrap;"></div>
    <form id="ask-form" style="display:flex;gap:6px;margin-bottom:6px;">
      <input id="ask-input" type="text" placeholder="Ask about this screen..." autocomplete="off"
        style="flex:1;min-width:0;padding:8px 9px;border-radius:8px;background:rgba(255,255,255,.07);color:#fff;font-size:10px;border:1px solid rgba(56,189,248,.2)!important;">
      <button class="primary" id="btn-ask" type="submit" style="width:auto;margin:0;padding:8px 10px;text-align:center;">Ask</button>
    </form>
    <button class="secondary" id="btn-observe">Stop observing</button>
  </div>

  <script type="module">
    const { getCurrentWindow } = window.__TAURI__.window;
    const { emit, listen } = window.__TAURI__.event;
    const { LogicalPosition } = window.__TAURI__.dpi;

    const companion = document.getElementById('companion');
    const bubble = document.getElementById('bubble');
    const speech = document.getElementById('speech');
    const speechText = document.getElementById('speech-text');
    const statusEl = document.getElementById('bubble-status');
    const statusText = document.getElementById('status-text');
    const btnObserve = document.getElementById('btn-observe');
    const btnAsk = document.getElementById('btn-ask');
    const askForm = document.getElementById('ask-form');
    const askInput = document.getElementById('ask-input');
    const answerEl = document.getElementById('answer');

    let currentState = 'idle';
    let isObserving = false;
    let bubbleOpen = false;
    let speechTimeout = null;
    let dragStarted = false;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let dragInProgress = false;

    // Distinguish a click (open chat) from a drag (move the character).
    // Start native dragging only after the pointer actually moves.
    companion.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      pointerStartX = e.screenX;
      pointerStartY = e.screenY;
      dragStarted = false;
      dragInProgress = true;
    });

    window.addEventListener('mousemove', async (e) => {
      if (!dragInProgress || dragStarted) return;
      const distance = Math.hypot(e.screenX - pointerStartX, e.screenY - pointerStartY);
      if (distance < 6) return;
      dragStarted = true;
      try {
        await getCurrentWindow().startDragging();
      } catch (err) {
        console.warn('VOSI companion drag failed', err);
      }
    });

    window.addEventListener('mouseup', () => {
      if (!dragInProgress) return;
      dragInProgress = false;
      setTimeout(savePosition, 250);
      // Keep dragStarted true until the following click handler suppresses it.
      setTimeout(() => { dragStarted = false; }, 0);
    });

    async function restorePosition() {
      try {
        const saved = localStorage.getItem('companion-pos');
        if (saved) {
          const { x, y } = JSON.parse(saved);
          await getCurrentWindow().setPosition(new LogicalPosition(x, y));
        }
      } catch (e) {}
    }

    async function savePosition() {
      try {
        const pos = await getCurrentWindow().outerPosition();
        localStorage.setItem('companion-pos', JSON.stringify({ x: pos.x, y: pos.y }));
      } catch (e) {}
    }

    function showSpeech(text, duration = 3200) {
      speechText.textContent = text;
      speech.classList.add('visible');
      if (speechTimeout) clearTimeout(speechTimeout);
      speechTimeout = setTimeout(() => speech.classList.remove('visible'), duration);
    }

    function hideSpeech() {
      speech.classList.remove('visible');
      if (speechTimeout) clearTimeout(speechTimeout);
    }

    function setState(state) {
      currentState = state;
      companion.className = state;
      statusEl.className = 'status' + (state === 'observing' ? ' observing' : '');
      const labels = {
        idle: 'Idle',
        asking: 'Asking permission…',
        observing: 'Observing screen',
        thinking: 'Thinking…',
        working: 'Working…',
        attention: 'Needs attention'
      };
      statusText.textContent = labels[state] || state;
      btnObserve.textContent = isObserving ? 'Stop observing' : 'Start observing';
    }

    function toggleBubble(force) {
      bubbleOpen = force !== undefined ? force : !bubbleOpen;
      bubble.classList.toggle('visible', bubbleOpen);
      if (bubbleOpen) {
        hideSpeech();
        setTimeout(() => askInput?.focus(), 60);
      }
    }

    companion.addEventListener('click', (e) => {
      if (dragStarted) {
        dragStarted = false;
        return; // don't open bubble after a drag
      }
      toggleBubble();
      e.stopPropagation();
    });

    document.addEventListener('click', (e) => {
      if (bubbleOpen && !bubble.contains(e.target) && !companion.contains(e.target)) {
        toggleBubble(false);
      }
    });

    btnObserve.addEventListener('click', async () => {
      try {
        setState('asking');
        showSpeech('Can I watch your screen?', 2800);
        await emit('companion-toggle-observe', { observing: !isObserving });
      } catch (e) {}
      toggleBubble(false);
    });

    askForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = (askInput.value || '').trim();
      if (!question) return;

      answerEl.style.display = 'block';
      answerEl.textContent = 'VOSI is looking at your current screen…';
      setState('thinking');

      try {
        // Ask the backend directly from the floating companion.
        // This keeps working even when the main VOSI window is hidden.
        const response = await fetch('http://127.0.0.1:8001/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question, include_screen: true })
        });

        const data = await response.json();

        if (data.success && data.brain) {
          const answer = data.brain.understanding || data.brain.suggestion || 'I understood your request.';
          answerEl.textContent = answer;
          setState(isObserving ? 'observing' : 'idle');
          showSpeech('Here’s what I found', 2600);
        } else {
          const error = data?.brain?.error || data?.error || 'VOSI could not answer that.';
          answerEl.textContent = error;
          setState(isObserving ? 'observing' : 'idle');
          showSpeech('I need a little help with that.', 2600);
        }
      } catch (err) {
        console.error('Companion AI request failed:', err);
        answerEl.textContent = 'I could not reach the VOSI brain. Make sure the backend is running on port 8001.';
        setState(isObserving ? 'observing' : 'idle');
        showSpeech('The AI brain is offline.', 2600);
      }
    });

    listen('companion-asking', () => {
      setState('asking');
      showSpeech('Can I watch your screen?', 3000);
    });

    listen('companion-state', (event) => {
      const { state, observing } = event.payload || {};
      if (typeof observing === 'boolean') isObserving = observing;
      if (state) setState(state);
      else setState(isObserving ? 'observing' : 'idle');
      if (state === 'observing' || isObserving) {
        hideSpeech();
        showSpeech('Watching your screen', 2200);
      }
    });

    listen('observation-status', (event) => {
      isObserving = !!event.payload?.active;
      if (isObserving) {
        setState('observing');
        hideSpeech();
        showSpeech('Watching your screen', 2200);
      } else {
        setState('idle');
        hideSpeech();
      }
    });

    listen('companion-denied', () => {
      setState('idle');
      showSpeech('Okay, I won’t look', 2500);
    });

    listen('companion-answer', (event) => {
      const payload = event.payload || {};
      isObserving = !!payload.observing;
      answerEl.style.display = 'block';
      answerEl.textContent = payload.answer || 'No answer received.';
      setState(isObserving ? 'observing' : 'idle');
      showSpeech(payload.success ? 'Here’s what I found' : 'I need a little help with that.', 2600);
      bubbleOpen = true;
      bubble.classList.add('visible');
    });

    restorePosition();
    setState('idle');

    (async () => {
      try {
        const win = getCurrentWindow();
        await win.show();
        await win.setAlwaysOnTop(true);
      } catch (e) {}
    })();
  </script>
</body>
</html>
