<!DOCTYPE html>
<html lang="en" class="h-full font-sans antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vosi - Your Screen Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['\"Plus Jakarta Sans\"', 'sans-serif'] },
                    colors: {
                        space: { 900: '#070913', 800: '#0B0E1E', 700: '#11152B', 600: '#171D3A', 500: '#1E2548' },
                        neon: { blue: '#3b82f6', purple: '#8b5cf6', cyan: '#06b6d4', indigo: '#6366f1' }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spin 20s linear infinite',
                        'spin-reverse-slow': 'spin-reverse 25s linear infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite'
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-12px)' } },
                        'spin-reverse': { '0%': { transform: 'rotate(360deg)' }, '100%': { transform: 'rotate(0deg)' } },
                        pulseGlow: { '0%, 100%': { opacity: '0.4', transform: 'scale(1)' }, '50%': { opacity: '0.8', transform: 'scale(1.05)' } }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(11, 14, 30, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 9999px; }
        .bg-space-base {
            position: relative; isolation: isolate; overflow: hidden;
            background: linear-gradient(180deg, #08284a 0%, #041b33 42%, #021225 76%, #010814 100%);
        }
        .bg-space-base::before {
            content: ""; position: fixed; inset: -20%; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 55% 45% at 18% 22%, rgba(14, 165, 233, 0.26) 0%, rgba(14, 116, 144, 0.10) 35%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 82% 18%, rgba(59, 130, 246, 0.22) 0%, rgba(37, 99, 180, 0.08) 40%, transparent 72%),
                radial-gradient(ellipse 70% 50% at 50% 45%, rgba(6, 182, 212, 0.10) 0%, transparent 65%),
                radial-gradient(ellipse 80% 40% at 50% 100%, rgba(8, 47, 73, 0.18) 0%, transparent 55%);
            filter: blur(28px); opacity: 0.95; transform: scale(1.08);
            animation: ambient-drift 9s ease-in-out infinite alternate;
        }
        .bg-space-base::after {
            content: ""; position: fixed; inset: -10%; z-index: 1; pointer-events: none;
            background:
                radial-gradient(ellipse at 30% 70%, rgba(34, 211, 238, 0.055) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 35%, rgba(96, 165, 250, 0.07) 0%, transparent 45%),
                linear-gradient(180deg, rgba(1, 12, 28, 0.08) 0%, transparent 30%, rgba(0, 5, 16, 0.42) 100%);
            animation: haze-shift 6s ease-in-out infinite alternate;
        }
        @keyframes ambient-drift {
            0% { transform: scale(1.08) translate3d(-6%, 3%, 0) rotate(-3deg); opacity: 0.75; }
            50% { transform: scale(1.22) translate3d(5%, -5%, 0) rotate(3deg); opacity: 1; }
            100% { transform: scale(1.13) translate3d(6%, 2%, 0) rotate(2deg); opacity: 0.85; }
        }
        @keyframes haze-shift {
            0% { opacity: 0.6; transform: translateX(-3%) translateY(1%) scale(1); }
            100% { opacity: 1; transform: translateX(3.5%) translateY(-2%) scale(1.06); }
        }
        .ambient-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(55px); mix-blend-mode: screen; opacity: 0.65; }
        .orb-1 { width: 60vw; height: 50vh; top: -18%; left: -12%; background: radial-gradient(circle, rgba(14,165,233,0.24) 0%, rgba(8,145,178,0.10) 40%, transparent 70%); animation: orb-float-1 7s ease-in-out infinite alternate; }
        .orb-2 { width: 48vw; height: 42vh; top: 2%; right: -10%; background: radial-gradient(circle, rgba(59,130,246,0.23) 0%, rgba(37,99,235,0.09) 45%, transparent 72%); animation: orb-float-2 8s ease-in-out infinite alternate; }
        .orb-3 { width: 42vw; height: 38vh; bottom: 5%; left: 20%; background: radial-gradient(circle, rgba(20,184,166,0.16) 0%, transparent 65%); animation: orb-float-3 10s ease-in-out infinite alternate; }
        @keyframes orb-float-1 { 0% { transform: translate(0, 0) scale(1); opacity: 0.65; } 100% { transform: translate(12%, 9%) scale(1.18); opacity: 1; } }
        @keyframes orb-float-2 { 0% { transform: translate(0, 0) scale(1.05); opacity: 0.5; } 100% { transform: translate(-14%, 16%) scale(1.06); opacity: 1; } }
        @keyframes orb-float-3 { 0% { transform: translate(0, 0) scale(1); opacity: 0.35; } 100% { transform: translate(13%, -15%) scale(1.28); opacity: 0.95; } }
        .nebula { position: fixed; pointer-events: none; z-index: 1; background: radial-gradient(ellipse at center, rgba(34,211,238,0.13) 0%, rgba(37,99,235,0.07) 36%, transparent 74%) !important; mix-blend-mode: screen; filter: blur(90px); opacity: 0.9; animation: nebula-drift 8s ease-in-out infinite alternate !important; }
        @keyframes nebula-drift { 0% { transform: scale(1) translate(0, 0); } 50% { transform: scale(1.12) translate(5%, -4%); } 100% { transform: scale(1.05) translate(-3%, 3%); } }
        .text-gradient-purple { background: linear-gradient(135deg, #67e8f9 0%, #38bdf8 50%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tab-card { background: rgba(18, 18, 20, 0.84); border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 20px; padding: clamp(18px, 2.4vw, 28px); box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.045); }
        .tab-card h2 { color:#fff; font-size:24px; font-weight:800; margin-bottom:8px; }
        .tab-card p { color:#94a3b8; font-size:13px; line-height:1.6; }
        .tab-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,.07); }
        .tab-row:last-child { border-bottom:0; }
        .tab-label { color:#e2e8f0; font-size:13px; font-weight:600; }
        .tab-value { color:#64748b; font-size:11px; }
        .task-state { display:inline-flex; padding:5px 9px; border-radius:999px; background:rgba(59,130,246,.12); color:#60a5fa; font-size:10px; font-weight:800; letter-spacing:.08em; }
        .vosi-app-shell { position: relative; z-index: 20; isolation: isolate; }
        .quick-action { padding: 9px 12px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; color: #dedede; background: rgba(255,255,255,.04); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .quick-action:hover { background: rgba(255,255,255,.11); border-color: rgba(125,190,255,.3); transform: translateY(-1px); }
    </style>
</head>
<body class="h-full bg-space-base text-white">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="nebula" style="width:50vw;height:40vh;top:10%;left:25%;"></div>

    <div id="app" class="vosi-app-shell min-h-full">
        <div class="max-w-5xl mx-auto px-4 py-10 flex flex-col items-center text-center">
            <img src="src/assets/logo.png" alt="VOSI" class="w-28 h-28 mb-4 object-contain" onerror="this.style.display='none'">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-gradient-purple">VOSI</h1>
            <p class="mt-3 text-slate-300 text-sm leading-relaxed px-4 max-w-xl">
                I'm here to understand your screen, follow what you're doing, and help when you need me.
            </p>

            <div class="w-full max-w-2xl mt-6 space-y-4">
                <form id="ai-prompt-form" class="relative flex items-center">
                    <div class="absolute left-4 text-indigo-400"><i data-lucide="sparkles" class="w-5 h-5"></i></div>
                    <input id="user-input" type="text" placeholder="Ask VOSI anything..." class="w-full pl-12 pr-24 py-3.5 rounded-2xl bg-space-800/80 border border-indigo-500/20 focus:border-indigo-400/50 focus:ring-2 focus:ring-indigo-500/20 text-sm text-white placeholder-slate-500 outline-none transition-all">
                    <div class="absolute right-2 flex items-center space-x-1">
                        <button type="button" id="mic-btn" class="p-2 rounded-full hover:bg-white/10 text-slate-400 hover:text-white transition-colors"><i data-lucide="mic" class="w-4 h-4"></i></button>
                        <button type="submit" class="p-2 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white transition-colors"><i data-lucide="arrow-right" class="w-4 h-4"></i></button>
                    </div>
                </form>

                <div class="flex flex-wrap justify-center gap-2">
                    <button class="quick-action" type="button" data-prompt="Explain what is visible on my shared screen. Keep it concise and separate what you can see from what you infer.">
                        Explain my screen
                    </button>
                    <button class="quick-action" type="button" data-prompt="Summarize my shared screen in three short bullet points.">
                        Summarize screen
                    </button>
                    <button class="quick-action" type="button" data-prompt="Guide me through the next step on my screen. Identify a control only if you can confidently see it; do not claim you clicked it.">
                        Guide next step
                    </button>
                    <button class="quick-action" type="button" data-action="awareness">
                        Start screen sharing
                    </button>
                </div>
            </div>

            <div id="tab-overlay" class="w-full max-w-2xl mt-8">
                <div id="tab-page-home" class="tab-card">
                    <h2>Home</h2>
                    <p>Your VOSI dashboard is ready. Ask a question, start screen awareness, or use the companion.</p>
                    <div class="tab-row">
                        <div>
                            <div class="tab-label">System</div>
                            <div class="tab-value">Local VOSI mode</div>
                        </div>
                        <span class="task-state">READY</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();

        document.querySelectorAll('.quick-action').forEach((btn) => {
            btn.addEventListener('click', () => {
                const input = document.getElementById('user-input');
                if (btn.dataset.prompt && input) {
                    input.value = btn.dataset.prompt;
                    input.focus();
                }
            });
        });

        document.getElementById('ai-prompt-form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const q = (input?.value || '').trim();
            if (!q) return;
            console.log('Ask VOSI:', q);
        });
    </script>
</body>
</html>
